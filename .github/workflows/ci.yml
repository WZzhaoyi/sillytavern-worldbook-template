name: CI

on:
  push:
    paths:
      - 'AGENTS.md'
      - 'works/**'
      - 'templates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'works/**'
      - 'templates/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Run generation script
        run: python scripts/generate_sillytavern.py --work works/示例作品

      - name: Verify outputs
        run: |
          for f in "works/示例作品/output/{作品名}世界书.json" "works/示例作品/output/{作品名}叙事者.json" "works/示例作品/output/悬浮状态栏.json"; do
            [ -s "$f" ] || { echo "FAIL: $f missing or empty"; exit 1; }
          done
          python -c "import json; json.load(open('works/示例作品/output/{作品名}世界书.json', encoding='utf-8'))"
          python -c "import json; json.load(open('works/示例作品/output/{作品名}叙事者.json', encoding='utf-8'))"
